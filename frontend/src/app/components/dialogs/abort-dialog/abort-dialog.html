<h2 mat-dialog-title>Aborting Study</h2>
<mat-dialog-content class="mat-typography">
  <h3>Do you really want to abort the study?</h3>
  <p>
    By pressing "Abort" you will revoke your consent and not be able to finish or take part in the study anymore.<br>
    Your data will be deleted and, consequently, not be evaluated.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="true" color="warn">Abort</button>
  <button mat-button mat-dialog-close cdkFocusInitial>Stay</button>
</mat-dialog-actions>

<h1>Badges</h1>
<div class="badges-container">
  <ng-container *ngFor="let badge of badges">
    <div
      *ngIf="badge.fulfilled" 
      class="badge"
      [matTooltip]="badge.tipp"
      matTooltipPosition="above"
    >
      <img
        [@unlock]="badge.fulfilled"
        class="overlay"
        [ngClass]="badge.fulfilled ? 'unlocked' : 'locked'"
        [src]="'../../../../assets/icons/' + badge.background"
      >
      <img
        [@unlock]="badge.fulfilled"
        [ngClass]="badge.fulfilled ? 'unlocked' : 'locked'"
        [src]="'../../../../assets/icons/' + badge.icon"
      >
      <h3 class="badge-name">{{badge.name}}</h3>
    </div>
  </ng-container>
  
  <div *ngIf="unlockedBadges.length === 0" class="badge">
    <img class="overlay" src="../../../../assets/icons/LockedOverlay.svg">
    <img class="locked" src="../../../../assets/icons/FrameLvl7.svg">
    <p>No Badge unlocked yet</p>
  </div>
</div>
